name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "Test plugin (${{ matrix.os }})"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install asdf
        uses: asdf-vm/actions/setup@v2

      - name: Add plugin
        run: asdf plugin add workmux .

      - name: Install tool
        run: asdf install workmux latest

      - name: Run test command
        run: workmux --version
